<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#244653">
<title>Firedriver · Maple Bay</title>
<style>
@font-face{font-family:Nunito;src:url('Nunito.ttf')}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#203d48;color:#eff8fc;font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}body{touch-action:none;user-select:none;-webkit-user-select:none}button{font:inherit;touch-action:none;cursor:pointer}#console{width:100%;height:100dvh;position:relative}#screen{position:absolute;inset:0;overflow:hidden;background:#294754}#canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#case-label,#controls{display:none}.touch #controls{display:block;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;bottom:max(34px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:3px solid #eff8fcb3;background:#254956a8;box-shadow:0 4px 0 #102f3a80,inset 0 0 0 9px #8acecf18;pointer-events:auto;touch-action:none}.stick::before,.stick::after{content:'';position:absolute;background:#d3f0ed28;border-radius:3px}.stick::before{width:2px;height:96px;top:11px;left:58px}.stick::after{width:96px;height:2px;top:58px;left:11px}.stick .knob{position:absolute;width:56px;height:56px;left:31px;top:31px;border-radius:50%;background:linear-gradient(#edf8f8,#add5d8);border:3px solid #294754;box-shadow:0 4px 0 #1c3b49;z-index:1;pointer-events:none}.stick span{position:absolute;top:132px;width:100%;text-align:center;font-size:10px;font-weight:900;letter-spacing:2px;text-shadow:0 1px 3px #173946}.stick[data-stick=drive]{left:max(24px,env(safe-area-inset-left))}.stick[data-stick=hose]{right:max(24px,env(safe-area-inset-right));border-color:#9fe9f7}.stick[data-stick=hose] .knob{background:linear-gradient(#aeedee,#52b5cb)}.action{position:absolute;bottom:28px;pointer-events:auto;min-width:58px;height:58px;border-radius:50%;border:3px solid #254653;box-shadow:0 5px 0 #183741;background:#ec806c;color:#244653;font-size:11px;font-weight:900}.action:active,.action.held{transform:translateY(3px);box-shadow:0 2px 0 #183741}.action svg{width:23px;height:23px;display:block;margin:0 auto 1px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}.action[data-action=jump]{right:178px;bottom:28px}.action[data-action=ladder]{right:178px;bottom:98px;background:#eff8fc}.utility{position:absolute;pointer-events:auto;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px}.utility button{border:2px solid #9ac5cf;color:#eff8fc;background:#294754d9;border-radius:12px;min-width:42px;height:38px;font-weight:900;font-size:13px}.utility button:nth-child(2),.utility button:nth-child(3){font-size:11px}.brand{letter-spacing:3px;font-weight:900}.speaker-grille{display:none}#launch{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#467779,#244653 80%);z-index:10}#launch h1{font-weight:900;font-size:clamp(36px,7vw,62px);margin:10px 0 0;letter-spacing:-2px}#launch p{max-width:360px;line-height:1.5;color:#c9e2e6;margin:12px auto 24px}#play{background:#ec806c;border:3px solid #183b46;border-radius:18px;color:#183b46;font-size:19px;font-weight:900;padding:15px 42px;box-shadow:0 6px 0 #142f37;min-width:200px;margin:auto}#play:disabled{opacity:.7}#status{font-size:13px;color:#c9e2e6;margin-top:20px;min-height:20px}#progress{width:min(300px,75vw);height:7px;border-radius:9px;background:#193a48;margin:16px auto 0;overflow:hidden}#progress span{display:block;background:#86d9dc;width:0;height:100%;transition:width .2s}.launch-icon{font-size:44px}.touch.portrait #console{display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(140deg,#dcebee,#b6d1d5);border-radius:0 0 44px 12px;color:#294754}.touch.portrait #screen{position:relative;inset:auto;flex:1;min-height:0;max-height:60dvh;border:9px solid #294754;border-radius:20px 20px 35px 20px;box-shadow:0 4px 0 #83a8b1,0 0 0 2px #f0fbfb}.touch.portrait #case-label{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:12px}.touch.portrait #case-label small{font-size:8px;letter-spacing:2px}.touch.portrait #controls{position:relative;inset:auto;height:270px;flex:0 0 270px}.touch.portrait .stick{width:112px;height:112px;bottom:94px;background:#93b4bb;border-color:#426675;box-shadow:0 5px 0 #7599a4,inset 0 0 0 8px #9cbec4}.touch.portrait .stick::before{left:52px;top:8px;height:90px}.touch.portrait .stick::after{top:52px;left:8px;width:90px}.touch.portrait .stick .knob{left:25px;top:25px}.touch.portrait .stick span{top:119px;text-shadow:none;font-size:10px}.touch.portrait .stick[data-stick=drive]{left:18px}.touch.portrait .stick[data-stick=hose]{right:18px}.touch.portrait .action[data-action=jump]{bottom:16px;right:23px}.touch.portrait .action[data-action=ladder]{bottom:16px;right:97px}.touch.portrait .utility{top:auto;bottom:28px;left:13px;right:auto;gap:7px}.touch.portrait .utility button{background:#688b97;border:2px solid #466572;min-width:42px;height:44px;font-size:10px;border-radius:14px;box-shadow:0 2px 0 #456571}.touch.portrait .utility button:first-child{font-size:13px}.touch.portrait .speaker-grille{display:block;position:absolute;left:calc(50% - 25px);top:46px;transform:rotate(-12deg);color:#83a3ac;letter-spacing:4px;font-size:22px;font-weight:900;pointer-events:none}.touch.portrait #launch{border-radius:10px}.touch.portrait #launch h1{font-size:38px}.touch.portrait #launch p{font-size:12px;margin:8px auto 14px}.touch.portrait .launch-icon{font-size:28px}.touch.portrait #play{padding:10px 26px;font-size:16px}.touch.portrait #status{margin-top:12px;font-size:11px}@media(max-height:680px) and (orientation:portrait){.touch.portrait #controls{height:228px;flex-basis:228px}.touch.portrait .stick{bottom:85px}.touch.portrait .speaker-grille{top:20px}.touch.portrait #case-label{padding:7px 12px}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="console">
<section id="screen" aria-label="Maple Bay game screen"><canvas id="canvas" tabindex="0" aria-label="Firetruck driving game"></canvas>
<div id="launch"><div class="launch-icon" aria-hidden="true">🚒</div><h1>Firedriver</h1><p>Little acts of heroism.<br>A fire engine, a full tank, and a town that needs you.</p><button id="play">Start your shift</button><div id="status" role="status">Welcome to Maple Bay</div><div id="progress"><span></span></div></div></section>
<div id="case-label"><span class="brand">FIREDRIVER</span><small>MAPLE BAY • UNIT 04</small></div>
<section id="controls" aria-label="Touch controls">
<div class="stick" data-stick="drive" role="slider" aria-label="Drive joystick" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div class="knob"></div><span>DRIVE</span></div>
<div class="stick" data-stick="hose" role="slider" aria-label="Aim and spray joystick" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div class="knob"></div><span>AIM + HOSE</span></div>
<div class="speaker-grille" aria-hidden="true">▏▏▏</div>
<button class="action" data-action="jump" aria-label="Hold to jump, or continue conversation"><svg viewBox="0 0 24 24"><path d="M5 18h14M12 16V4m-5 5 5-5 5 5"/></svg><span>JUMP</span></button>
<button class="action" data-action="ladder" aria-label="Extend or retract ladder"><svg viewBox="0 0 24 24"><path d="M7 21V3m10 18V3M7 6h10M7 11h10M7 16h10"/></svg><span>LADDER</span></button>
<div class="utility"><button data-action="pause" aria-label="Pause or resume">Ⅱ</button><button data-action="map" aria-label="Toggle town map">MAP</button><button data-action="recover" aria-label="Recover at the station">RESET</button></div>
</section></main>
<script src="$GODOT_URL"></script>
<script>
'use strict';
const canvas=document.querySelector('#canvas'),screen=document.querySelector('#screen');
const state=window.firetruckTouch={enabled:false,portrait:false,driveX:0,driveY:0,aimX:0,aimY:0,jump:false,ladder:0,pause:0,map:0,recover:0,cancel:0,talking:false,testing:new URLSearchParams(location.search).has('qa'),telemetry:"",width:0,height:0};
let started=false,ready=false;
const resetters=[];
const forced=new URLSearchParams(location.search).has('touch');
function clearControls(){state.driveX=state.driveY=state.aimX=state.aimY=0;state.jump=false;state.cancel++;resetters.forEach(reset=>reset());document.querySelectorAll('.knob').forEach(k=>k.style.transform='');document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));}
function layout(){const touch=forced||matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;state.enabled=touch;state.portrait=touch&&innerHeight>innerWidth;document.body.classList.toggle('touch',touch);document.body.classList.toggle('portrait',state.portrait);clearControls();resizeCanvas();}
function resizeCanvas(){const rect=screen.getBoundingClientRect();state.width=canvas.clientWidth;state.height=canvas.clientHeight;const dpr=Math.min(devicePixelRatio||1,state.enabled?1.5:2);const w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;} }
addEventListener('resize',layout);addEventListener('orientationchange',layout);addEventListener('blur',clearControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls();});new ResizeObserver(resizeCanvas).observe(screen);
for(const pad of document.querySelectorAll('.stick')){let pointer=null;const knob=pad.querySelector('.knob'),drive=pad.dataset.stick==='drive';function move(e){const r=pad.getBoundingClientRect(),limit=r.width*.32;let x=(e.clientX-r.left-r.width/2)/limit,y=(e.clientY-r.top-r.height/2)/limit;const length=Math.hypot(x,y);if(length>1){x/=length;y/=length;}knob.style.transform=`translate(${x*limit}px,${y*limit}px)`;const dead=.12;const gain=length<dead?0:Math.min(1,(length-dead)/(1-dead))/Math.min(1,length);state[drive?'driveX':'aimX']=x*gain;state[drive?'driveY':'aimY']=y*gain;}
resetters.push(()=>{if(pointer!==null&&pad.hasPointerCapture(pointer))pad.releasePointerCapture(pointer);pointer=null;});
pad.addEventListener('pointerdown',e=>{if(pointer!==null||!ready)return;e.preventDefault();pointer=e.pointerId;pad.setPointerCapture(pointer);move(e);});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();move(e);}});function release(e){if(e.pointerId!==pointer)return;pointer=null;state[drive?'driveX':'aimX']=0;state[drive?'driveY':'aimY']=0;knob.style.transform='';}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);pad.addEventListener('lostpointercapture',release);}
for(const button of document.querySelectorAll('[data-action]')){let pointer=null;const action=button.dataset.action;resetters.push(()=>{if(pointer!==null&&button.hasPointerCapture(pointer))button.releasePointerCapture(pointer);pointer=null;});button.addEventListener('pointerdown',e=>{if(!ready||pointer!==null)return;e.preventDefault();pointer=e.pointerId;button.setPointerCapture(pointer);button.classList.add('held');if(action==='jump')state.jump=true;else state[action]++;});function release(e){if(e.pointerId!==pointer)return;pointer=null;button.classList.remove('held');if(action==='jump')state.jump=false;}button.addEventListener('pointerup',release);button.addEventListener('pointercancel',e=>{state.cancel++;release(e)});button.addEventListener('lostpointercapture',release);}
window.firetruckDialogue=(talking)=>{state.talking=talking;document.querySelector('[data-action=jump] span').textContent=talking?'TALK':'JUMP';};
const status=document.querySelector('#status'),play=document.querySelector('#play');
const engine=new Engine($GODOT_CONFIG);
play.addEventListener('click',async()=>{if(started)return;started=true;play.disabled=true;status.textContent='Getting your engine ready…';try{await engine.startGame({canvas,canvasResizePolicy:0,focusCanvas:true,onProgress:(n,total)=>{if(total)document.querySelector('#progress span').style.width=`${n/total*100}%`;},onPrintError:(...args)=>console.error(...args)});ready=true;document.querySelector('#launch').hidden=true;document.querySelector('#launch').style.display='none';resizeCanvas();canvas.focus();}catch(error){status.textContent='Could not start. Please use a browser with WebGL 2 and reload to try again.';console.error(error);}});
layout();
</script>
</body></html>
