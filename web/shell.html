<style>
@font-face{font-family:Nunito;src:url('Nunito.ttf')}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#203d48;color:#eff8fc;font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}body{touch-action:none;user-select:none;-webkit-user-select:none}button{font:inherit;touch-action:none;cursor:pointer}#console{width:100%;height:100dvh;position:relative}#screen{position:absolute;inset:0;overflow:hidden;background:#294754}#canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#controls{display:none}.touch #controls{display:block;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;bottom:max(34px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:3px solid #eff8fcb3;background:#254956a8;box-shadow:0 4px 0 #102f3a80,inset 0 0 0 9px #8acecf18;pointer-events:auto;touch-action:none}.stick::before,.stick::after{content:'';position:absolute;background:#d3f0ed28;border-radius:3px}.stick::before{width:2px;height:96px;top:11px;left:58px}.stick::after{width:96px;height:2px;top:58px;left:11px}.stick .knob{position:absolute;width:56px;height:56px;left:31px;top:31px;border-radius:50%;background:linear-gradient(#edf8f8,#add5d8);border:3px solid #294754;box-shadow:0 4px 0 #1c3b49;z-index:1;pointer-events:none}.stick span{position:absolute;top:132px;width:100%;text-align:center;font-size:10px;font-weight:900;letter-spacing:2px;text-shadow:0 1px 3px #173946}.stick[data-stick=drive]{left:max(24px,env(safe-area-inset-left))}.stick[data-stick=hose]{right:max(24px,env(safe-area-inset-right));border-color:#9fe9f7}.stick[data-stick=hose] .knob{background:linear-gradient(#aeedee,#52b5cb)}.action{position:absolute;bottom:28px;pointer-events:auto;min-width:58px;height:58px;border-radius:50%;border:3px solid #254653;box-shadow:0 5px 0 #183741;background:#ec806c;color:#244653;font-size:11px;font-weight:900}.action:active,.action.held{transform:translateY(3px);box-shadow:0 2px 0 #183741}.action svg{width:23px;height:23px;display:block;margin:0 auto 1px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}.action[data-action=jump]{right:178px;bottom:28px}.action[data-action=ladder]{right:178px;bottom:98px;background:#eff8fc}#launch{color:#eff8fc;position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#467779,#244653 80%);z-index:10}#launch h1{font-weight:900;font-size:clamp(36px,7vw,62px);margin:0 0 32px;letter-spacing:-2px}#play{background:#ec806c;border:3px solid #183b46;border-radius:18px;color:#183b46;font-size:19px;font-weight:900;padding:15px 42px;box-shadow:0 6px 0 #142f37;min-width:200px;margin:auto}#play:disabled{opacity:.7}#status{font-size:13px;color:#c9e2e6;margin-top:20px;min-height:20px}#progress{width:min(300px,75vw);height:7px;border-radius:9px;background:#193a48;margin:16px auto 0;overflow:hidden}#progress span{display:block;background:#86d9dc;width:0;height:100%;transition:width .2s}.touch.portrait #console{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(140deg,#dcebee,#b6d1d5);border-radius:0 0 44px 12px;color:#294754}.touch.portrait #screen{position:relative;inset:auto;flex:1;min-height:0;border:0;border-radius:0;box-shadow:none;width:100%}.touch.portrait #controls{position:relative;inset:auto}.touch.portrait .stick{width:112px;height:112px;bottom:94px;background:#93b4bb;border-color:#426675;box-shadow:0 5px 0 #7599a4,inset 0 0 0 8px #9cbec4}.touch.portrait .stick::before{left:52px;top:8px;height:90px}.touch.portrait .stick::after{top:52px;left:8px;width:90px}.touch.portrait .stick .knob{left:25px;top:25px}.touch.portrait .stick span{top:119px;text-shadow:none;font-size:10px}.touch.portrait .stick[data-stick=drive]{left:18px}.touch.portrait .stick[data-stick=hose]{right:18px}.touch.portrait .action[data-action=jump]{bottom:16px;right:23px}.touch.portrait .action[data-action=ladder]{bottom:16px;right:97px}.touch.portrait #launch{border-radius:0}.touch.portrait #launch h1{font-size:38px}.touch.portrait #play{padding:10px 26px;font-size:16px}.touch.portrait #status{margin-top:12px;font-size:11px}@media(max-height:680px) and (orientation:portrait){.touch.portrait #controls{height:228px;flex-basis:228px}.touch.portrait .stick{bottom:85px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

#portrait-map{display:none}#pause{display:none;position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:42px;height:38px;border:2px solid #9ac5cf;border-radius:12px;background:#294754e8;color:#eff8fc;font-size:18px;font-weight:900}.touch #pause{display:block}.touch.portrait #portrait-map{display:block;position:absolute;left:50%;top:0;width:clamp(104px,34vw,136px);height:clamp(104px,34vw,136px);transform:translateX(-50%);pointer-events:none}.touch.portrait #controls{height:280px;flex-basis:280px}.touch.portrait .stick{bottom:100px}.touch.portrait .action[data-action=jump]{bottom:12px;right:28px}.touch.portrait .action[data-action=ladder]{bottom:12px;left:28px;right:auto}
@media(max-height:680px) and (orientation:portrait){.touch.portrait #controls{height:238px;flex-basis:238px}.touch.portrait .stick{bottom:90px;width:100px;height:100px}.touch.portrait .stick .knob{left:19px;top:19px}.touch.portrait .stick::before{left:46px;top:8px;height:78px}.touch.portrait .stick::after{top:46px;left:8px;width:78px}.touch.portrait .stick span{top:106px}.touch.portrait #portrait-map{width:108px;height:108px}.touch.portrait .action{height:50px;min-width:50px}.touch.portrait .action[data-action=jump],.touch.portrait .action[data-action=ladder]{bottom:6px}}
.touch:not(.portrait) .stick{bottom:12px}.touch:not(.portrait) .stick span{top:auto;bottom:8px;font-size:9px;letter-spacing:1px}.touch:not(.portrait) .action[data-action=ladder]{left:178px;right:auto;bottom:28px}
.touch:not(.playing) #controls,.touch:not(.playing) #pause{display:none}
body.paused .stick,body.paused .action,body.paused #portrait-map,body.intro .stick,body.intro .action,body.intro #pause,body.intro #portrait-map{visibility:hidden}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="console">
<section id="screen" aria-label="Maple Bay game screen"><canvas id="canvas" tabindex="0" aria-label="Firetruck driving game"></canvas>
<div id="launch"><h1>Firedriver</h1><button id="play">Start</button><div id="status" role="status" class="sr-only"></div><div id="progress" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100"><span></span></div></div></section>
<button id="pause" data-action="pause" aria-label="Pause or resume">Ⅱ</button>
<section id="controls" aria-label="Touch controls">
<canvas id="portrait-map" width="280" height="280" aria-label="Town minimap"></canvas>
<div class="stick" data-stick="drive" role="slider" aria-label="Drive joystick" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div class="knob"></div><span>DRIVE</span></div>
<div class="stick" data-stick="hose" role="slider" aria-label="Aim and spray joystick" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><div class="knob"></div><span>AIM + HOSE</span></div>
<button class="action" data-action="jump" aria-label="Hold to jump, or continue conversation"><svg viewBox="0 0 24 24"><path d="M5 18h14M12 16V4m-5 5 5-5 5 5"/></svg><span>JUMP</span></button>
<button class="action" data-action="ladder" aria-label="Extend or retract ladder"><svg viewBox="0 0 24 24"><path d="M7 21V3m10 18V3M7 6h10M7 11h10M7 16h10"/></svg><span>LADDER</span></button>

</section></main>
<script src="$GODOT_URL"></script>
<script>
'use strict';
const canvas=document.querySelector('#canvas'),screen=document.querySelector('#screen');
const state=window.firetruckTouch={enabled:false,portrait:false,driveX:0,driveY:0,aimX:0,aimY:0,jump:false,ladder:0,pause:0,map:0,recover:0,cancel:0,talking:false,testing:new URLSearchParams(location.search).has('qa'),telemetry:"",width:0,height:0};
window.firetruckPause=paused=>{document.body.classList.toggle("paused",paused);if(paused)clearControls();};
window.firetruckMainMenu=()=>{clearControls();location.reload();};
window.firetruckIntro=active=>document.body.classList.toggle('intro',active);
let started=false,ready=false,engineStarted=false,nativeReady=false;
const resetters=[];
const forced=new URLSearchParams(location.search).has('touch');
function clearControls(){state.driveX=state.driveY=state.aimX=state.aimY=0;state.jump=false;state.cancel++;resetters.forEach(reset=>reset());document.querySelectorAll('.knob').forEach(k=>k.style.transform='');document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));}
function layout(){const touch=forced||matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;state.enabled=touch;state.portrait=touch&&innerHeight>innerWidth;document.body.classList.toggle('touch',touch);document.body.classList.toggle('portrait',state.portrait);clearControls();resizeCanvas();}
function resizeCanvas(){const rect=screen.getBoundingClientRect();state.width=canvas.clientWidth;state.height=canvas.clientHeight;const dpr=Math.min(devicePixelRatio||1,state.enabled?1.5:2,Math.sqrt(2000000/Math.max(1,canvas.clientWidth*canvas.clientHeight)));const w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;} }
addEventListener('resize',layout);addEventListener('orientationchange',layout);addEventListener('blur',clearControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls();});new ResizeObserver(resizeCanvas).observe(screen);
for(const pad of document.querySelectorAll('.stick')){let pointer=null;const knob=pad.querySelector('.knob'),drive=pad.dataset.stick==='drive';function move(e){const r=pad.getBoundingClientRect(),limit=r.width*.32;let x=(e.clientX-r.left-r.width/2)/limit,y=(e.clientY-r.top-r.height/2)/limit;const length=Math.hypot(x,y);if(length>1){x/=length;y/=length;}knob.style.transform=`translate(${x*limit}px,${y*limit}px)`;const dead=.12;const gain=length<dead?0:Math.min(1,(length-dead)/(1-dead))/Math.min(1,length);state[drive?'driveX':'aimX']=x*gain;state[drive?'driveY':'aimY']=y*gain;}
resetters.push(()=>{if(pointer!==null&&pad.hasPointerCapture(pointer))pad.releasePointerCapture(pointer);pointer=null;});
pad.addEventListener('pointerdown',e=>{if(pointer!==null||!ready)return;e.preventDefault();pointer=e.pointerId;pad.setPointerCapture(pointer);move(e);});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();move(e);}});function release(e){if(e.pointerId!==pointer)return;pointer=null;state[drive?'driveX':'aimX']=0;state[drive?'driveY':'aimY']=0;knob.style.transform='';}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);pad.addEventListener('lostpointercapture',release);}
for(const button of document.querySelectorAll('[data-action]')){let pointer=null;const action=button.dataset.action;resetters.push(()=>{if(pointer!==null&&button.hasPointerCapture(pointer))button.releasePointerCapture(pointer);pointer=null;});button.addEventListener('pointerdown',e=>{if(!ready||pointer!==null)return;e.preventDefault();pointer=e.pointerId;button.setPointerCapture(pointer);button.classList.add('held');if(action==='jump')state.jump=true;else state[action]++;});function release(e){if(e.pointerId!==pointer)return;pointer=null;button.classList.remove('held');if(action==='jump')state.jump=false;}button.addEventListener('pointerup',release);button.addEventListener('pointercancel',e=>{state.cancel++;release(e)});button.addEventListener('lostpointercapture',release);}
window.firetruckDialogue=(talking)=>{state.talking=talking;document.querySelector('[data-action=jump] span').textContent=talking?'TALK':'JUMP';};
// A lightweight deck map updates at 10 Hz without copying the WebGL canvas.
const mapCanvas=document.querySelector('#portrait-map'),mapContext=mapCanvas.getContext('2d');
let mapData={hydrants:[],jobs:[]},mapState=[0,12,0,0,0,0,-14,-63,false];
window.firetruckMapSetup=data=>{mapData=data;drawMap();};
window.firetruckMap=(...values)=>{mapState=values;drawMap();};
function drawMap(){
 const c=mapContext; c.setTransform(2,0,0,2,140,140);c.clearRect(-70,-70,140,140);
 const circle=(x,y,r,color)=>{c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.fill();};
 circle(0,2,66,'#29475430');circle(0,0,65,'#294754');circle(0,0,61,'#eff8fc');circle(0,0,57,'#73a9b7');circle(0,0,54,'#294754');circle(0,0,52,'#a8cbb9');
 const at=(x,z)=>[(x*Math.cos(.5)-z*Math.sin(.5))*52/92,(x*Math.sin(.5)+z*Math.cos(.5))*52/92];
 const line=(a,b,width,color)=>{c.beginPath();c.moveTo(...at(...a));c.lineTo(...at(...b));c.lineWidth=width;c.strokeStyle=color;c.stroke();};
 c.save();c.beginPath();c.arc(0,0,52,0,Math.PI*2);c.clip();
 for(const x of [-36,0,36])for(const axis of [0,1]){const a=axis?[x,-62]:[-62,x],b=axis?[x,62]:[62,x];line(a,b,5,'#587c87');line(a,b,2.7,'#eff8fc');}
 line([-70,-63],[70,-63],2.8,'#294754');line([-70,-63],[70,-63],.9,'#d9b579');
 for(const [x,z] of [[-15,13],[18,19],[19,-20],[-19,-20],[49,18],[-48,18],[18,49],[-19,49],[-49,-22]]){const [px,py]=at(x,z);c.fillStyle='#6e9290';c.fillRect(px-3,py-2,6,4);}
 for(const [x,z] of mapData.hydrants){const p=at(x,z);circle(...p,2.5,'#294754');circle(...p,1.5,'#80e0ed');}
 for(const [x,z] of mapData.jobs)circle(...at(x,z),2.4,'#a17099');
 const [x,z,heading,stage,ox,oz,tx,tz,navigation]=mapState;
 circle(...at(tx,tz),2.4,'#d99e64');
 if(navigation)circle(...at(ox,oz),3.5,'#ec806c');
 let [px,py]=at(x,z);const length=Math.hypot(px,py);if(length>46){px*=46/length;py*=46/length;}
 c.translate(px,py);c.rotate(-heading+.5);circle(0,0,6,'#294754');c.beginPath();c.moveTo(0,-5);c.lineTo(4,4);c.lineTo(0,2);c.lineTo(-4,4);c.closePath();c.fillStyle='#eff8fc';c.fill();c.restore();
 for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5])circle(Math.cos(a)*59,Math.sin(a)*59,1.8,'#294754');
 c.fillStyle='#294754';c.fillRect(20,-63,18,16);c.font='900 11px Nunito';c.textAlign='center';c.fillStyle='#eff8fc';c.fillText('N',29,-51);
}
const status=document.querySelector('#status'),play=document.querySelector('#play');
function progress(value){document.querySelector('#progress span').style.width=`${value*100}%`;document.querySelector('#progress').setAttribute('aria-valuenow',Math.round(value*100));}
function showGame(){if(!engineStarted||!nativeReady)return;ready=true;document.body.classList.add("playing");progress(1);const launch=document.querySelector('#launch');launch.hidden=true;launch.style.display='none';resizeCanvas();drawMap();canvas.focus();}
window.firetruckWarmup=value=>progress(.75+value*.24);
window.firetruckReady=()=>{nativeReady=true;showGame();};
const engine=new Engine($GODOT_CONFIG);
play.addEventListener('click',async()=>{if(started)return;started=true;play.disabled=true;status.textContent='Getting your engine ready…';try{await engine.startGame({canvas,canvasResizePolicy:0,focusCanvas:true,onProgress:(n,total)=>{if(total)progress(n/total*.75);},onPrintError:(...args)=>console.error(...args)});engineStarted=true;showGame();}catch(error){status.classList.remove('sr-only');status.textContent='Could not start. Please use a browser with WebGL 2 and reload to try again.';console.error(error);}});
layout();drawMap();
</script>
</body></html>
