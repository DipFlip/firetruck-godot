name: Web build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Export browser build with Godot 4.7.2
        shell: bash
        run: |
          source tools/install_godot_linux.sh
          tools/build_web.sh
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/hud_layout_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/performance_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/conversations_life_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/water_feedback_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/braking_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/birds_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/dialogue_dock_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/visibility_guards_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/ladder_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/cannon_aim_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/town_feedback_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/town_additions_test.gd
          "$GODOT_BIN" --headless --fixed-fps 60 --path . --script tests/car_wash_assist_test.gd
      - uses: actions/upload-artifact@v5
        with:
          name: firetruck-web
          path: builds/web/
          retention-days: 30
